name: VS Code Extension - Bleeding Edge VSIX

on:
  workflow_dispatch:

jobs:
  build-vsix:
    runs-on: ubuntu-latest

    env:
      # Ensure npm authentication and configuration is isolated to this workflow.
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Set up local npm registry (Verdaccio)
      #
      # Verdaccio is used to simulate real npm publishing of packages
      # to ensure the VS Code extension is packaged and tested in an
      # environment that closely resembles end user usage.
      # ------------------------------------------------------------        
      - name: Set up Verdaccio
        run: |
          docker run -d \
            -p 4873:4873 \
            -v ${{ github.workspace }}/.verdaccio/conf:/verdaccio/conf \
            --name verdaccio \
            verdaccio/verdaccio

      - name: Check Verdaccio is running
        run: |
          until curl -fs http://localhost:4873/-/ping; do
            sleep 2
          done

      # Registry storage may persist between runs; ensure a clean state.
      - name: Reset local registry
        run: rm -rf .verdaccio/storage/*

      # ------------------------------------------------------------
      # Node + pnpm setup
      # ------------------------------------------------------------
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ------------------------------------------------------------
      # Install dependencies and build packages
      # ------------------------------------------------------------
      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build

      # ------------------------------------------------------------
      # Configure npm for local publishing
      #
      # Authentication is faked because Verdaccio only requires
      # a token to satisfy npm client checks.
      # ------------------------------------------------------------
      - name: Configure npm auth (CI only)
        run: |
            npm set registry http://localhost:4873
            echo "//localhost:4873/:_authToken=fake-token" >> ${{ github.workspace }}/.npmrc

      # ------------------------------------------------------------
      # Publish bleeding-edge packages locally
      # ------------------------------------------------------------
      - name: Publish language server (local)
        working-directory: ./packages/language-server
        run: npm publish
      - name: Publish typescript plugin (local)
        working-directory: ./packages/typescript-plugin
        run: npm publish

      # ------------------------------------------------------------
      # Prepare isolated extension install
      #
      # Workspace files are intentionally removed so that npm
      # resolves dependencies exactly as end users would.
      #
      # This prevents pnpm workspace linking from hiding:
      # - missing files
      # - incorrect exports
      # - runtime dependency issues
      # ------------------------------------------------------------
      - name: Prepare VS Code extension package
        working-directory: ./packages/tatzeroko-vscode
        run: |
          rm -rf node_modules
          rm ../../pnpm-workspace.yaml ../../pnpm-lock.yaml ../../package.json

          npm pkg set dependencies.@tatzeroko/language-server="*"
          npm pkg set dependencies.@tatzeroko/typescript-plugin="*"

          npm install

      # ------------------------------------------------------------
      # Package and upload VSIX
      #
      # The resulting VSIX can be installed manually in VS Code
      # for testing unpublished, bleeding-edge functionality.
      # ------------------------------------------------------------
      - name: Package VSIX
        working-directory: ./packages/tatzeroko-vscode
        run: |
          npx vsce package --out tatzeroko-vscode-${{ github.sha }}.vsix
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: tatzeroko-vscode-${{ github.sha }}
          path: ./packages/tatzeroko-vscode/*.vsix

      # ------------------------------------------------------------
      # Cleanup
      # ------------------------------------------------------------
      - name: Stop Verdaccio
        if: always()
        run: |
          docker stop verdaccio
          docker rm verdaccio